<!-- Android 13+ themed-icon layer. Same transform as adaptive-foreground.svg, but a
     single flat colour: the system reads only the alpha channel and applies its own
     wallpaper-derived tint. Black on white is not arbitrary here — qlmanage flattens onto
     white, and pure #000 makes the coverage exactly recoverable as a = 255 - v. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <g transform="translate(8.5 13.065) scale(0.83)">
    <path d="M41 33c0-5.5 5.5-5.5 5.5-11S41 16.5 41 11" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M57 33c0-5.5 5.5-5.5 5.5-11S57 16.5 57 11" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <rect x="21" y="41" width="58" height="7.5" rx="3.75" fill="#000000"/>
    <path d="M27 51h46l-4.5 21a10 10 0 0 1-9.8 8H41.3a10 10 0 0 1-9.8-8z" fill="#000000"/>
  </g>
</svg>
