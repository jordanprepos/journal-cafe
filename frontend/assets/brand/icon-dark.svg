<!-- iOS 18 dark app icon. Transparent by design: Apple composites this over a system
     dark gradient, so painting our own #1F1A17 ground would flatten it to a plain tile.
     Framing is identical to cafe-journal-primary.svg so light and dark register together.
     qlmanage flattens onto white, so this one needs two-background alpha recovery — see
     README.md. The splash's dark image keeps its ground; nothing composites that. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <path d="M41 33c0-5.5 5.5-5.5 5.5-11S41 16.5 41 11" fill="none" stroke="#D4A373" stroke-width="4" stroke-linecap="round"/>
  <path d="M57 33c0-5.5 5.5-5.5 5.5-11S57 16.5 57 11" fill="none" stroke="#D4A373" stroke-width="4" stroke-linecap="round"/>
  <rect x="21" y="41" width="58" height="7.5" rx="3.75" fill="#FBF6EC"/>
  <path d="M27 51h46l-4.5 21a10 10 0 0 1-9.8 8H41.3a10 10 0 0 1-9.8-8z" fill="#FBF6EC"/>
</svg>
