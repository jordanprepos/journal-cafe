name: Create Production Builds

# No `on:` trigger — production builds are started deliberately, either from the
# expo.dev dashboard or with `npx -y eas-cli@latest workflow:run
# create-production-builds.yml` from `frontend/`.
#
# This file must stay under `frontend/`: workflows are discovered relative to the
# EAS project root (the directory holding `eas.json`), which is `frontend/`, not
# the repo root.

jobs:
  build_android:
    type: build # This job type creates a production build for Android
    params:
      platform: android
  build_ios:
    type: build # This job type creates a production build for iOS
    params:
      platform: ios
